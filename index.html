<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سامانه نسیه فروشگاه میر جلیل هاشمی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--card:#fff;--line:#d5d9e0;--pri:#1e3a5f;--on:#fff;--tx:#1a2230;--mut:#5b6678;--hov:#eef1f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#171e28;--line:#2c3644;--pri:#8fb2df;--on:#0d1420;--tx:#e8ecf2;--mut:#9aa5b7;--hov:#1e2733}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#171e28;--line:#2c3644;--pri:#8fb2df;--on:#0d1420;--tx:#e8ecf2;--mut:#9aa5b7;--hov:#1e2733}
*{box-sizing:border-box;margin:0}
html{height:100%}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--tx);min-height:100%;padding:24px 16px;line-height:1.7}
.wrap{max-width:1100px;margin:auto}
header{border-bottom:3px solid var(--pri);padding-bottom:14px;margin-bottom:22px}
h1{font-weight:800;font-size:clamp(20px,3.6vw,28px);color:var(--pri)}
header p{color:var(--mut);font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:48px 20px;text-align:center}
.ico{width:56px;height:56px;margin:0 auto 18px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--pri);animation:sp 1.1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.ico{animation:none}}
.panel h2{display:inline-block;font-size:20px;font-weight:800;color:var(--pri);border-right:4px solid var(--pri);padding-right:10px;margin-bottom:12px}
.panel p{color:var(--mut);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
 <header><h1>سامانه نسیه فروشگاه میر جلیل هاشمی</h1><p>ثبت و مدیریت بدهی و طلب اشخاص</p></header>
 <div class="panel" role="status">
  <div class="ico" aria-hidden="true"></div>
  <h2>سامانه در حال بروزرسانی می‌باشد</h2>
  <p>از صبر و شکیبایی شما متشکریم</p>
 </div>
</div>
</body>
</html>
